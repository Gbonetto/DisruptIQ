# SonarCloud Configuration for DisruptIQ

# Organization and project keys
sonar.organization=disruptiq
sonar.projectKey=disruptiq_DisruptIQ_CC

# Project information
sonar.projectName=DisruptIQ - Smart RAG System
sonar.projectVersion=1.0.0

# Source code paths
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__

# Exclusions
sonar.exclusions=**/migrations/**,**/node_modules/**,**/venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/.next/**

# Python specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Code coverage
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/test_*.py,**/*.test.ts,**/*.spec.ts

# Duplication exclusions
sonar.cpd.exclusions=**/migrations/**,**/tests/**

# Analysis parameters
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Language distribution
sonar.language=py,js,ts

# Issue exclusions
# Exclude TODOs from being reported as issues
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

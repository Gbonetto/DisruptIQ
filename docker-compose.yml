version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: disruptiq_postgres
    environment:
      POSTGRES_DB: disruptiq
      POSTGRES_USER: disruptiq
      POSTGRES_PASSWORD: disruptiq_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disruptiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: disruptiq_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: disruptiq_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disruptiq_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://disruptiq:disruptiq_password@postgres:5432/disruptiq
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Mistral AI (Primary)
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL}
      MISTRAL_VISION_MODEL: ${MISTRAL_VISION_MODEL}
      # OpenAI (Fallback)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Anthropic (Deprecated)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # N8N
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL}
      N8N_WEBHOOK_AUTH_TOKEN: ${N8N_WEBHOOK_AUTH_TOKEN}
      # Security
      SECRET_KEY: ${SECRET_KEY}
      # Gmail
      GMAIL_CREDENTIALS_PATH: ${GMAIL_CREDENTIALS_PATH}
      GMAIL_TOKEN_PATH: ${GMAIL_TOKEN_PATH}
      # SSL
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disruptiq_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: disruptiq_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  default:
    name: disruptiq_network

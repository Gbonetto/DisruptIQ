version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: disruptiq_postgres
    environment:
      POSTGRES_DB: disruptiq
      POSTGRES_USER: disruptiq
      POSTGRES_PASSWORD: disruptiq_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./n8n/init-db.sql:/docker-entrypoint-initdb.d/02-init-n8n.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disruptiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: disruptiq_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: disruptiq_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: disruptiq_n8n
    environment:
      # Basic Configuration
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678/

      # Database - Use PostgreSQL for persistence
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: disruptiq
      DB_POSTGRESDB_PASSWORD: disruptiq_password

      # Security
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-disruptiq_n8n_2024}

      # Execution
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true

      # Timezone (Paris)
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris

      # DisruptIQ Integration
      DISRUPTIQ_API_URL: http://backend:8000
      DISRUPTIQ_WEBHOOK_TOKEN: ${N8N_WEBHOOK_AUTH_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disruptiq_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://disruptiq:disruptiq_password@postgres:5432/disruptiq
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Mistral AI (Primary)
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL}
      MISTRAL_VISION_MODEL: ${MISTRAL_VISION_MODEL}
      # OpenAI (Fallback)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Anthropic (Deprecated)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # N8N - Internal Docker network URL
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_AUTH_TOKEN: ${N8N_WEBHOOK_AUTH_TOKEN}
      N8N_TIMEOUT: ${N8N_TIMEOUT:-30}
      N8N_MAX_RETRIES: ${N8N_MAX_RETRIES:-3}
      # Security
      SECRET_KEY: ${SECRET_KEY}
      # Gmail
      GMAIL_CREDENTIALS_PATH: ${GMAIL_CREDENTIALS_PATH}
      GMAIL_TOKEN_PATH: ${GMAIL_TOKEN_PATH}
      # Légifrance API
      LEGIFRANCE_CLIENT_ID: ${LEGIFRANCE_CLIENT_ID}
      LEGIFRANCE_CLIENT_SECRET: ${LEGIFRANCE_CLIENT_SECRET}
      # SSL
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disruptiq_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: disruptiq_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  n8n_data:

networks:
  default:
    name: disruptiq_network

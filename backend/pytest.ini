[pytest]
# Pytest Configuration for DisruptIQ Backend
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts =
    --verbose
    --strict-markers
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing:skip-covered
    --cov-report=json:coverage.json
    --cov-branch
    --cov-fail-under=25
    --maxfail=5
    --tb=short
    -ra
    --durations=10
    --asyncio-mode=auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require dependencies)
    e2e: End-to-end tests (slowest, full stack)
    slow: Tests that take a long time to run
    asyncio: Async tests
    security: Security-related tests
    performance: Performance tests
    smoke: Smoke tests for critical paths
    api: API endpoint tests
    database: Tests requiring database
    rag: Tests for RAG/vector search
    auth: Authentication tests
    email: Email generation tests
    websocket: WebSocket tests
    sql_agent: SQL Agent natural language tests
    coproprietes: Copropriétés CRUD tests
    coproprietaires: Copropriétaires CRUD tests

# Async configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage paths to omit
[coverage:run]
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
